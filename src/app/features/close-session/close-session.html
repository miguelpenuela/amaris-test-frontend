<div class="row">
    <div class="col-12">
        <div class="icon-container">
            <i class="fa-solid fa-person-walking-arrow-right"></i>
        </div>
        <div class="title-container">
            <p class="title">Log Out</p>
        </div>
        <div class="text-container">
            <p>¿Are you sure you want to close session?</p>
        </div>
    </div>
</div>
<div class="row">
    <div class="col-6">
        <div class="d-grid gap-2">
            <button class="btn btn-secondary" (click)="cancel()">No, cancel</button>
        </div>
    </div>
    <div class="col-6">
        <div class="d-grid gap-2">
            <button class="btn btn-primary" (click)="confirm()">Yes, go out</button>
        </div>
    </div>
</div>
