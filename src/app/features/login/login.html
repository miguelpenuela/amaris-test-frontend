<div class="container main-container">
    <div class="row main-subcontainer justify-content-center">
        <div class="col-xs-12 col-sm-12 col-md-6 col-lg-6">
            <form (submit)="login()" [formGroup]="form">
                <div class="login-container">
                    <label class="title">InvestmentApp</label>
                    <p>Access your dashboard</p>
                    <br/>
                    <div class="form-field">
                        <label>Email Address</label>
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon1"><i class="fa fa-at"></i></span>
                            <input type="text" class="form-control" placeholder="felpegarxon@mail.com" formControlName="username">
                        </div>
                    </div>
                    
                    <div class="form-field">
                        <label>Password</label>
                        <div class="input-group mb-3">
                            <span class="input-group-text" id="basic-addon1"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" class="form-control" placeholder="**********" formControlName="password">
                        </div>
                    </div>

                    <button class="btn btn-primary mb-2" [disabled]="!this.form.valid">
                        Log In <i class="fa-solid fa-arrow-right"></i>
                    </button>
                    <hr/>
                    <span>New to Investment? <a [routerLink]="'/register'">Create your account</a></span>
                </div>
            </form>
        </div>
    </div>
</div>
