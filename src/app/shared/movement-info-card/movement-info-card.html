@if (movement) {
    <div class="row">
        <div class="col-12">
            <div class="movement-info-card-container">
                <div class="row">
                    <div class="col-2">
                        <div class="movement-info-card-container__icon">
                            <i [class]="getIconByType(movement.type).icon"></i>
                        </div>
                    </div>
                    <div class="col-6">
                        <div class="movement-info-card-container__info">
                            <span class="movement-info-card-container__info__tag">{{movement.type}}</span><br/>
                            <span class="movement-info-card-container__info__date">Date: {{movement.created_at | date: 'M/d/yy, h:mm a'}}</span>
                        </div>
                    </div>
                    <div class="col-12">
                        <div class="movement-info-card-container__amount">
                            <span>{{movement.amount | currency: 'COP'}}</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
}
